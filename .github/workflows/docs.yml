name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'packages/kiln/src/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      # TypeDoc reads packages/kiln/src, so the workspace deps are needed too.
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: docs
      # api/ is gitignored; `bun run build` regenerates it with TypeDoc first.
      - run: bun run build
        working-directory: docs
      # Publishes to https://kilnjs.pages.dev (Cloudflare Pages, free plan).
      # Needs repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          preCommands: npx wrangler pages project create kilnjs --production-branch main || true
          command: pages deploy docs/.vitepress/dist --project-name kilnjs --branch main
