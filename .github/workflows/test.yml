name: Test

# The same checks the publish workflow gates on, on every push and pull request, so a release tag
# only goes out on a commit that already passed here.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
